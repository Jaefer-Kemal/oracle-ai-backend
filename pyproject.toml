[tool.poetry]
name = "rag-backend"
version = "0.1.0"
description = "Professional Production RAG API"
authors = ["Antigravity <ai@deepmind.com>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
sqlalchemy = "^2.0.0"
pgvector = "^0.2.0"
psycopg2-binary = "^2.9.0"
cohere = ">=5.0.0"
pypdf = "^3.15.0"
python-docx = "^1.0.0"
python-dotenv = "^1.0.0"
python-multipart = "^0.0.6"
curl_cffi = ">=0.7.4"
coincurve = "^20.0.0"
beautifulsoup4 = "^4.12.0"
colorama = "^0.4.6"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["recommended"], version = "^1.7.4"}
bcrypt = "^5.0.0"
browser-cookie3 = ">=0.20.1"
gemini-webapi = ">=1.8.3"
g4f = ">=0.4.1.2"
platformdirs = "^4.3.8"
pywin32 = { version = "==308", platform = "win32" }
pycryptodomex = { version = ">=3.21.0", platform = "win32" }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
